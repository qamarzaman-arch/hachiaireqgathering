[package]
name = "hachiai"
version = "0.1.0"
description = "Hachiai Requirements Gathering Tool"
authors = ["Jules"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# We'll move our recorder logic here or keep it as a workspace
hachiai-recorder = { path = "../../recorder" }
